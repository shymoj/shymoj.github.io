<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shayan M | Demo Page</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <script>
    fetch('navbar.html')
      .then(r => r.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        if (menuToggle && navLinks) {
          menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            menuToggle.classList.toggle('is-active');
          });
        }
      });
  </script>

  <main class="container">
    <header class="page-hero">
      <h1>Demo Page</h1>
      <p class="page-subtitle">Interactive lab pages &amp; JavaScript utilities</p>
    </header>

    <div class="glass-panel centered">
      <div style="display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem;">
        <a href="index.html" class="btn-modern">Home</a>
        <a href="demo.html" class="btn-modern">Demo</a>
        <a href="table.html" class="btn-modern">Data Table</a>
        <a href="welcome.html" class="btn-modern">Welcome Form</a>
      </div>
      <p id="demoText" style="font-size: 1.15rem;"></p>
    </div>
  </main>

  <script>
    document.getElementById('demoText').innerHTML = "<strong>Success!</strong> JavaScript is running perfectly.";
  </script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
