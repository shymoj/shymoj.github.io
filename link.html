<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shayan M | Links</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <script>
    fetch('navbar.html')
      .then(r => r.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        if (menuToggle && navLinks) {
          menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            menuToggle.classList.toggle('is-active');
          });
        }
      });
  </script>

  <main class="container">
    <header class="page-hero">
      <h1 class="centered sansSerif">Links</h1>
      <p class="page-subtitle">Curated external articles and resources</p>
    </header>

    <div class="glass-panel centered">
      <p style="font-size: 1.15rem; margin-bottom: 1rem;">
        <a href="https://www.howtogeek.com/248177/whats-new-in-windows-10s-anniversary-update/" target="_blank" rel="noopener noreferrer" class="btn-modern">New features for Windows 10 Anniversary Update &nearr;</a>
      </p>
      <p style="color: var(--text-secondary);">Source: howtogeek.com</p>
    </div>
  </main>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
