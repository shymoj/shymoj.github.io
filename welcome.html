<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shayan M | Welcome Page</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <script>
    fetch('navbar.html')
      .then(r => r.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        if (menuToggle && navLinks) {
          menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            menuToggle.classList.toggle('is-active');
          });
        }
      });
  </script>

  <main class="container">
    <header class="page-hero">
      <h1>Welcome Form</h1>
      <p class="page-subtitle">Enter your name below for a personalized greeting</p>
    </header>

    <form id="welcomeForm" class="myForm">
      <div class="form-group-modern">
        <label for="userName">Please enter your name:</label>
        <input type="text" id="userName" placeholder="Your name..." required>
      </div>
      <button type="submit">Submit</button>
      <h2 id="greetingMessage" style="color: #34d399; margin-top: 20px; text-align: center; font-size: 1.4rem;"></h2>
    </form>
  </main>

  <script>
    document.getElementById('welcomeForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const name = document.getElementById('userName').value.trim();
      document.getElementById('greetingMessage').textContent = 'Welcome, ' + name + '!';
      document.getElementById('userName').value = '';
    });
  </script>
</body>
</html>
